name: EcoQuality Rewards background processor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecoquality-rewards-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'EcoQualityInc/ecoquality-rewards-scheduler' &&
      vars.REWARDS_SCHEDULER_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch bounded private Rewards queues
        env:
          REWARDS_SCHEDULER_ENABLED: ${{ vars.REWARDS_SCHEDULER_ENABLED }}
          REWARDS_SCHEDULER_OWNER: ${{ vars.REWARDS_SCHEDULER_OWNER }}
          REWARDS_SCHEDULER_QUEUES: ${{ vars.REWARDS_SCHEDULER_QUEUES }}
          REWARDS_SCHEDULER_ORIGIN: https://ecoqualityinc.com
          REWARDS_WORKER_SECRET: ${{ secrets.REWARDS_SCHEDULER_WORKER_SECRET }}
        shell: bash
        run: |
          if node scripts/rewards/actions-scheduler.mjs >/dev/null; then
            echo 'Rewards dispatch completed.'
          else
            echo '::error::Rewards dispatch failed. Review the private Rewards administration.'
            exit 1
          fi
